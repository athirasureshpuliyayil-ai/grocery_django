{% extends 'base.html' %}
{% block content %}

<div class="flex gap-6">
  <!-- Sidebar -->
  <aside class="w-1/4 bg-white rounded-xl shadow p-5">
    <h2 class="text-lg font-bold mb-4 text-green-700">Dashboard</h2>
    <ul class="space-y-3">
      <li>
        <a href="{% url 'shop:dashboard' %}" class="block hover:text-green-600">🧾 My Orders</a>
      </li>
      <li>
        <a href="{% url 'shop:edit_profile' %}" class="block text-green-700 font-semibold">✏️ Edit Profile</a>
      </li>
      <li>
        <a href="{% url 'shop:cart_detail' %}" class="block hover:text-green-600">🛒 My Cart</a>
      </li>
      <li>
        <form action="{% url 'logout' %}" method="post" class="mt-2">
          {% csrf_token %}
          <button type="submit" class="text-red-600 hover:text-red-800">🚪 Logout</button>
        </form>
      </li>
    </ul>
  </aside>

  <!-- Main Content -->
  <section class="flex-1 bg-white shadow-md rounded-xl p-6">
    <h1 class="text-2xl font-semibold text-green-700 mb-4">Edit Profile</h1>

    <form method="post" class="space-y-4 max-w-lg">
      {% csrf_token %}
      {{ form.as_p }}
      <button type="submit" class="bg-green-600 text-white px-4 py-2 rounded hover:bg-green-700">
        Save Changes
      </button>
    </form>
  </section>
</div>

{% endblock %}
