{% extends 'base.html' %}
{% block content %}
<div class="bg-white p-6 rounded shadow">
  <h2 class="text-2xl font-bold">{{ product.name }}</h2>
  <p class="mt-2">{{ product.description }}</p>
  <div class="mt-4">
    <span class="text-xl font-semibold">₹{{ product.price }}</span>
    <span class="ml-4 text-sm text-gray-600">Stock: {{ product.stock }}</span>
  </div>
  <form method="post" action="{% url 'shop:cart_add' product.id %}" class="mt-4">
    {% csrf_token %}
    <input type="number" name="quantity" value="1" min="1" class="w-20 border rounded px-2 py-1">
    <button class="ml-2 px-4 py-2 rounded bg-green-600 text-white">Add to cart</button>
  </form>
</div>
{% endblock %}
