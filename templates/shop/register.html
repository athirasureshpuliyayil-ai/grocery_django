{% extends 'base.html' %}
{% block content %}

<div class="flex justify-center items-center min-h-screen bg-green-50">
  <div class="bg-white p-8 rounded-2xl shadow-lg w-full max-w-md">
    <h2 class="text-2xl font-bold text-center text-green-700 mb-6">Create Your Account 🌿</h2>

    <form method="post" class="space-y-4">
      {% csrf_token %}
      {{ form.non_field_errors }}

      <div>
        <label class="block text-sm font-medium mb-1 text-gray-700">Username</label>
        {{ form.username }}
      </div>
      <div>
        <label class="block text-sm font-medium mb-1 text-gray-700">Email</label>
        {{ form.email }}
      </div>
      <div>
        <label class="block text-sm font-medium mb-1 text-gray-700">Password</label>
        {{ form.password1 }}
      </div>
      <div>
        <label class="block text-sm font-medium mb-1 text-gray-700">Confirm Password</label>
        {{ form.password2 }}
      </div>

      <button type="submit" class="w-full bg-green-600 text-white py-2 rounded hover:bg-green-700 transition">
        Sign Up
      </button>
    </form>

    <p class="text-center text-sm mt-4 text-gray-600">
      Already have an account?
      <a href="{% url 'login' %}" class="text-green-600 hover:underline">Login</a>
    </p>
  </div>
</div>

{% endblock %}
