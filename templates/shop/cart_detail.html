{% extends 'base.html' %}
{% block content %}
<h2 class="text-xl font-bold mb-4">Your Cart</h2>
{% if items %}
  <div class="space-y-4">
    {% for it in items %}
      <div class="bg-white p-4 rounded shadow flex justify-between items-center">
        <div>
          <div class="font-semibold">{{ it.product.name }}</div>
          <div class="text-sm text-gray-600">₹{{ it.product.price }} x {{ it.quantity }}</div>
        </div>
        <div class="text-right">
          <div class="font-semibold">₹{{ it.subtotal }}</div>
        </div>
      </div>
    {% endfor %}
    <div class="text-right font-bold">Total: ₹{{ total }}</div>
    <div class="text-right">
      <a href="{% url 'shop:checkout' %}" class="px-4 py-2 rounded bg-blue-600 text-white">Checkout</a>
    </div>
  </div>
{% else %}
  <p>Your cart is empty.</p>
{% endif %}
{% endblock %}
