{% extends 'base.html' %}
{% block content %}

<div class="max-w-3xl mx-auto bg-white shadow-md rounded-lg p-6 mt-8">
  <h2 class="text-2xl font-bold text-green-700 mb-6">Checkout</h2>

  <form method="post" class="space-y-4">
    {% csrf_token %}
    {{ form.as_p }}

    <h3 class="text-xl font-semibold mt-6 mb-2">Your Cart</h3>
    <ul class="divide-y divide-gray-200 mb-4">
      {% for item in cart %}
      <li class="py-2 flex justify-between">
        <span>{{ item.product.name }} (x{{ item.quantity }})</span>
        <span>₹{{ item.total_price }}</span>
      </li>
      {% endfor %}
    </ul>

    <p class="font-semibold text-lg">Total: ₹{{ cart.get_total_price }}</p>

    <button type="submit" class="bg-green-600 text-white px-5 py-2 rounded hover:bg-green-700 transition">
      Place Order (Cash on Delivery)
    </button>
  </form>
</div>

{% endblock %}
