{% extends 'base.html' %}
{% block content %}

<div class="flex justify-center items-center min-h-screen bg-green-50">
  <div class="bg-white p-8 rounded-2xl shadow-lg w-full max-w-md">
    <h2 class="text-2xl font-bold text-center text-green-700 mb-6">Welcome Back 👋</h2>

    {% if form.errors %}
      <div class="bg-red-100 text-red-700 p-3 rounded mb-4 text-sm">
        Invalid username or password. Please try again.
      </div>
    {% endif %}

    <form method="post" class="space-y-4">
      {% csrf_token %}
      <div>
        <label class="block text-sm font-medium mb-1 text-gray-700">Username</label>
        {{ form.username }}
      </div>
      <div>
        <label class="block text-sm font-medium mb-1 text-gray-700">Password</label>
        {{ form.password }}
      </div>
      <button type="submit" class="w-full bg-green-600 text-white py-2 rounded hover:bg-green-700 transition">
        Login
      </button>
    </form>

    <p class="text-center text-sm mt-4 text-gray-600">
      Don't have an account?
      <a href="{% url 'shop:register' %}" class="text-green-600 hover:underline">Sign up</a>
    </p>
  </div>
</div>

{% endblock %}
